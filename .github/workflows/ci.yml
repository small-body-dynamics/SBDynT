name: Python CI

# Trigger the workflow on pushes or pull requests to any branch
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    # Run the steps inside the official latest Python Docker container
    container:
      image: python:latest

    steps:
    # Step 1: Check out the repository code into the container
    - name: Check out repository code
      uses: actions/checkout@v4

    # Step 2: Install dependencies from requirements.txt
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # Step 3: Run all test files inside the tests/ folder
    - name: Run tests
      run: |
        # If you use pytest (recommended):
        pytest tests/
        
        # OR if you are using standard python unittest, uncomment the line below:
        # python -m unittest discover -s tests